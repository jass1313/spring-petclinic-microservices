name: CI/CD - Build & Push Docker Images

on:
  push:
    branches:
      - main-mydockerhub-CICD

env:
  DOCKER_USERNAME: jasbeer0013
  VERSION: 4.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR Files
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push All Services
        run: |
          SERVICES=(
            config-server:8888
            discovery-server:8761
            api-gateway:8080
            customers-service:8081
            visits-service:8082
            vets-service:8083
            admin-server:9090
            genai-service:8084
          )

          for SERVICE in "${SERVICES[@]}"; do
            NAME=$(echo $SERVICE | cut -d':' -f1)
            PORT=$(echo $SERVICE | cut -d':' -f2)

            docker build -t $DOCKER_USERNAME/$NAME:$VERSION \
              --build-arg ARTIFACT_NAME=spring-petclinic-$NAME/target/spring-petclinic-$NAME-$VERSION \
              --build-arg EXPOSED_PORT=$PORT \
              -f docker/Dockerfile .

            docker push $DOCKER_USERNAME/$NAME:$VERSION
          done
