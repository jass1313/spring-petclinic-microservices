name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main-mydockerhub-CICD

env:
  DOCKER_USERNAME: jasbeer0013
  VERSION: 4.0.1
  DOCKERVERSION: 4.0.2

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JARs
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Images
        run: |
          SERVICES=(config-server discovery-server api-gateway customers-service visits-service vets-service admin-server genai-service)

          for SERVICE in "${SERVICES[@]}"
          do
            docker build \
              -t $DOCKER_USERNAME/$SERVICE:$DOCKERVERSION \
              --build-arg ARTIFACT_NAME=spring-petclinic-$SERVICE/target/spring-petclinic-$SERVICE-$VERSION.jar \
              --build-arg EXPOSED_PORT=8080 \
              -f docker/Dockerfile .

            docker push $DOCKER_USERNAME/$SERVICE:$DOCKERVERSION
          done

      - name: Deploy to EC2 (Kubernetes Update)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            script: |
              kubectl set image deployment/config-server config-server=${{ secrets.DOCKER_USERNAME }}/config-server:${{ env.DOCKERVERSION }} -n petclinic
              kubectl set image deployment/discovery-server discovery-server=${{ secrets.DOCKER_USERNAME }}/discovery-server:${{ env.DOCKERVERSION }} -n petclinic
              kubectl set image deployment/api-gateway api-gateway=${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ env.DOCKERVERSION }} -n petclinic
              kubectl set image deployment/customers-service customers-service=${{ secrets.DOCKER_USERNAME }}/customers-service:${{ env.DOCKERVERSION }} -n petclinic
              kubectl set image deployment/visits-service visits-service=${{ secrets.DOCKER_USERNAME }}/visits-service:${{ env.DOCKERVERSION }} -n petclinic
              kubectl set image deployment/vets-service vets-service=${{ secrets.DOCKER_USERNAME }}/vets-service:${{ env.DOCKERVERSION }} -n petclinic
              kubectl rollout status deployment --all -n petclinic
