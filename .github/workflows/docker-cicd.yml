name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main-mydockerhub-CICD

env:
  DOCKER_USERNAME: jasbeer0013
  VERSION: 4.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JARs
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Images
        run: |
          SERVICES=(config-server discovery-server api-gateway customers-service visits-service vets-service admin-server genai-service)

          for SERVICE in "${SERVICES[@]}"
          do
            docker buildx build \
              --platform linux/amd64 \
              -t $DOCKER_USERNAME/$SERVICE:$VERSION \
              --build-arg ARTIFACT_NAME=spring-petclinic-$SERVICE/target/spring-petclinic-$SERVICE-$VERSION \
              -f docker/Dockerfile . \
              --push
          done
