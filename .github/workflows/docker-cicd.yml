name: CI/CD - Build & Push Docker Images

on:
  push:
    branches:
      - main-mydockerhub-CICD

env:
  DOCKER_USERNAME: jasbeer0013
  VERSION: 4.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR Files
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Config Server
        run: |
          docker build -t $DOCKER_USERNAME/config-server:$VERSION \
            --build-arg ARTIFACT_NAME=spring-petclinic-config-server/target/spring-petclinic-config-server-$VERSION \
            --build-arg EXPOSED_PORT=8888 \
            -f docker/Dockerfile .
          docker push $DOCKER_USERNAME/config-server:$VERSION
